services:
  - type: web
    name: styleon-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FRONTEND_URL
        value: https://styleon-frontend.onrender.com

  - type: web
    name: styleon-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://styleon-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html